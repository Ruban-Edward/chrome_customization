    <!-- The main container now holds both pages -->
    <div class="container-fluid">

        <!-- Landing Page Wrapper -->
        <div id="landingPage" class="page-container">
            <div class="row">
                <div class="col-12 text-center secondary">
                    <div id="date"></div>
                    <div id="greeting" aria-live="polite"></div>
                    <div class="viewer">
                        <div class="image-container" id="imageContainer">
                            <!-- Images with links will be inserted dynamically -->
                        </div>
                        <button id="manageShortcuts" class="manage-shortcuts" type="button">Manage links</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Page Wrapper -->
        <div id="searchPage" class="page-container">
            <div id="clock"></div>
            <form id="searchForm">
                <div class="search-controls">
                    <label class="visually-hidden" for="searchEngine">Search engine</label>
                    <select id="searchEngine" aria-label="Search engine">
                        <option value="google">Google</option>
                        <option value="bing">Bing</option>
                        <option value="duckduckgo">DuckDuckGo</option>
                    </select>
                </div>
                <textarea id="display" rows="3" maxlength="2000" spellcheck="false" aria-label="Search the web" placeholder="Search the web..." enterkeyhint="search"></textarea>
            </form>
        </div>

    </div>

    <dialog id="shortcutDialog" aria-labelledby="shortcutDialogTitle">
        <form id="shortcutForm">
            <div class="shortcut-dialog-header">
                <h2 id="shortcutDialogTitle">Manage links</h2>
                <button id="closeShortcutDialog" type="button" aria-label="Close">&times;</button>
            </div>
            <div id="shortcutList"></div>
            <button id="addShortcut" class="dialog-secondary-button" type="button">+ Add link</button>
            <div class="shortcut-dialog-actions">
                <button id="cancelShortcutChanges" class="dialog-secondary-button" type="button">Cancel</button>
                <button class="dialog-primary-button" type="submit">Save links</button>
            </div>
        </form>
    </dialog>

    <!-- Loader Overlay -->
    <div id="loader-overlay" role="status" aria-label="Searching">
        <div id="wifi-loader">
            <svg class="circle-outer" viewBox="0 0 86 86">
                <circle class="back" cx="43" cy="43" r="40"></circle>
                <circle class="front" cx="43" cy="43" r="40"></circle>
                <circle class="new" cx="43" cy="43" r="40"></circle>
            </svg>
            <svg class="circle-middle" viewBox="0 0 60 60">
                <circle class="back" cx="30" cy="30" r="27"></circle>
                <circle class="front" cx="30" cy="30" r="27"></circle>
            </svg>
            <svg class="circle-inner" viewBox="0 0 34 34">
                <circle class="back" cx="17" cy="17" r="14"></circle>
                <circle class="front" cx="17" cy="17" r="14"></circle>
            </svg>
            <div class="text" data-text="Searching"></div>
        </div>
    </div>
